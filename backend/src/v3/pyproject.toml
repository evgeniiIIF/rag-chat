[project]
name = "ragchat-v3"
version = "0.1.0"
description = "RAG chat v3: answers strictly from the document via LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "docx2txt>=0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.13",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ragas>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]  # русский текст: кириллица не «двусмысленна»

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "domain", "graph", "infrastructure", "schemas", "services"]

[tool.mypy]
python_version = "3.12"
# кэш вынесен из репозитория: иначе тысячи файлов под fs.watch ломают inotify (ENOSPC)
cache_dir = "/tmp/mypy-cache/v3"
strict = true
files = ["api", "core", "domain", "graph", "infrastructure", "main.py", "schemas", "services"]
explicit_package_bases = true
mypy_path = "."
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
