[project]
name = "rag-chat-backend"
version = "0.1.0"
description = "RAG chat backend (FastAPI) answering strictly from a single document"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic>=2.7.4,<2.8",
    "pydantic-settings==2.3.0",
    "langchain==0.1.16",
    "langsmith>=0.1.100",
    "langchain-openai==0.1.7",
    "langchain-community==0.0.36",
    "chromadb==0.5.0",
    "openai==1.30.1",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pypdf==4.2.0",
    "docx2txt==0.8",
    "python-docx==1.1.2",
    "rank-bm25==0.2.2",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.13",
    "mypy>=1.13",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pip-audit==2.7.3",
]

[tool.ruff]
line-length = 120
cache-dir = "/tmp/ruffcache"
respect-gitignore = false
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# кэш вынесен из репозитория: иначе тысячи файлов под fs.watch ломают inotify (ENOSPC)
cache_dir = "/tmp/mypy-cache/backend"
strict = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/models", "src/services"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlalchemy", "sqlalchemy.*", "langchain_openai", "langchain_openai.*", "langchain_community", "langchain_community.*", "langchain_core", "langchain_core.*", "rank_bm25", "rank_bm25.*", "docx", "docx.*", "chromadb", "chromadb.*", "langsmith", "langsmith.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
