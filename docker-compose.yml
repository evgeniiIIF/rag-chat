services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    container_name: ragchat_nginx
    expose:
      - "80"
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ragchat_backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      BACKEND_DATA_DIR: /data
      BACKEND_ARTIFACTS_DIR: /app/artifacts
      BACKEND_CHROMA_DIR: /app/.chroma
      BACKEND_CHUNKS_DOC: /app/docs/chunks.md
    volumes:
      # исходники монтируются -> uvicorn --reload видит правки без пересборки образа
      - ./backend/src/v3:/app
      - /app/.venv
      - ./docs:/app/docs
      - ./backend/data:/data:ro
      - ./backend/src/v3/.chroma:/app/.chroma
      - ./backend/src/v3/artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ragchat_frontend
    expose:
      - "5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  default:
    name: ragchat_net
