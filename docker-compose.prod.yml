services:
  nginx:
    build:
      context: ./nginx
    container_name: ragchat_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragchat_backend
    expose:
      - "8000"
    environment:
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://polza.ai/api/v1}
      BACKEND_EMBEDDING_MODEL: ${BACKEND_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      BACKEND_LLM_MODEL: ${BACKEND_LLM_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      BACKEND_CHROMA_DIR: /app/.chroma
      BACKEND_DATA_DIR: /app/data
      BACKEND_ARTIFACTS_DIR: /app/artifacts
      BACKEND_RETRIEVER_K: ${BACKEND_RETRIEVER_K:-3}
      BACKEND_SCORE_THRESHOLD: ${BACKEND_SCORE_THRESHOLD:-0.35}
      BACKEND_TEMPERATURE: ${BACKEND_TEMPERATURE:-0.0}
      BACKEND_MAX_TOKENS: ${BACKEND_MAX_TOKENS:-800}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
    volumes:
      - ./backend/data:/app/data:ro
      - chroma_db:/app/.chroma
      - artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragchat_frontend
    expose:
      - "80"
    restart: unless-stopped

volumes:
  chroma_db:
  artifacts:
  certbot_www:

networks:
  default:
    name: ragchat_net
